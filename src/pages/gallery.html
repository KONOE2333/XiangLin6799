<!DOCTYPE html>
<html lang="zh-CN">
<head>
{{head}}
</head>
<body class="home photo-sphere">
<canvas id="star-rain"></canvas>
{{nav}}

<main class="sphere-stage" id="sphere-stage">
  <div class="sphere" id="photo-sphere" aria-label="翔霖照片球"></div>
  <p class="sphere-hint" id="sphere-hint">照片正在聚拢 · 点击按钮展开</p>
</main>

<div class="sphere-actions" id="sphere-actions" aria-hidden="true">
  <button class="sphere-action sphere-action-rotate" id="sphere-action-rotate" type="button">
    <span class="action-icon">✦</span>拖拽旋转
  </button>
  <button class="sphere-action sphere-action-board" id="sphere-action-board" type="button">
    <span class="action-icon">✦</span>打开照片软木板
  </button>
</div>

<div class="memory-core-wrap" id="memory-core-wrap">
  <svg class="core-ring" viewBox="0 0 140 140" aria-hidden="true">
    <circle class="core-ring-bg" cx="70" cy="70" r="62"></circle>
    <circle class="core-ring-fill" id="core-ring-fill" cx="70" cy="70" r="62"></circle>
  </svg>
  <button class="memory-core" id="memory-core" type="button" aria-label="按住并转动记忆核心，充能后展开照片球">
    <span class="core-icon">✦</span>
  </button>
</div>

<div class="gallery-board" id="gallery-board" aria-hidden="true">
  <div class="board-shell">
    <div class="board-head">
      <div>
        <h2>小海盐软木板</h2>
        <p>上传照片，直接钉到星空软木板上；拖动照片可以重新摆放。</p>
      </div>
      <div class="board-head-actions">
        <div class="board-zoom" id="board-zoom">
          <button id="board-zoom-out" type="button" aria-label="缩小画布">−</button>
          <span id="board-zoom-label">画布 100%</span>
          <button id="board-zoom-in" type="button" aria-label="放大画布">+</button>
          <button id="board-zoom-reset" type="button">复位</button>
        </div>
        <button id="gallery-admin-toggle" class="board-admin-toggle" type="button">站长模式</button>
        <button id="gallery-board-close" class="board-close" type="button">收起软木板</button>
      </div>
    </div>
    <form class="board-upload" id="gallery-upload-form">
      <label class="board-file">
        <span>选择本地图片</span>
        <input id="gallery-image" type="file" accept="image/*" required>
      </label>
      <input id="gallery-title" type="text" placeholder="标题（可选）" maxlength="40">
      <button type="submit">贴上软木板 ✦</button>
      <span id="gallery-upload-msg" class="board-msg"></span>
    </form>
    <div class="board-wall" id="gallery-wall">
      <div class="board-canvas" id="board-canvas"></div>
    </div>
  </div>
</div>

<audio id="bgm" loop preload="none"></audio>
<button id="music-btn" class="music-disc" type="button" title="背景音乐">♪</button>

{{scripts}}
</body>
</html>

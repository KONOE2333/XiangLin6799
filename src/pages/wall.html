<!DOCTYPE html>
<html lang="zh-CN">
<head>
{{head}}
</head>
<body class="home">
<canvas id="star-rain"></canvas>
{{nav}}

<section class="section">
  <h2 class="section-title reveal">粉丝留言墙</h2>
  <p class="section-sub reveal">写下你想对翔霖或同担说的话，贴在这面墙上</p>
  <form class="msg-form" id="msg-form">
    <input type="text" id="msg-name" maxlength="16" placeholder="你的昵称（必填）" required>
    <textarea id="msg-text" maxlength="120" placeholder="留言内容，120 字以内…" required></textarea>
    <button type="submit">贴上便签 ✦</button>
  </form>
  <div class="wall" id="wall-body"></div>
</section>

<div class="admin-soft" id="admin-bar">
  <span class="admin-label" id="admin-label">站长管理</span>
  <input id="admin-code" class="admin-code" type="password" placeholder="输入口令" maxlength="32" autocomplete="off">
  <button id="admin-enter" class="admin-enter" type="button">进入</button>
  <span id="admin-hint" class="admin-hint"></span>
</div>

{{footer}}

<audio id="bgm" loop preload="none"></audio>
<button id="music-btn" class="music-disc" type="button" title="背景音乐">♪</button>

{{scripts}}
</body>
</html>
